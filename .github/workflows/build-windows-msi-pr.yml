name: Build Windows MSI PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WiX Toolset (v3)
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve app version
        id: app_version
        shell: pwsh
        run: |
          $version = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          .\installers\windows\build_msi.ps1 -Version "${{ steps.app_version.outputs.version }}"

      - name: Create combined Windows package
        shell: pwsh
        run: |
          $version = "${{ steps.app_version.outputs.version }}"
          $packageRoot = "installers/windows/dist/package"
          $zipPath = "installers/windows/dist/rubberduck-windows-$version.zip"

          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $packageRoot | Out-Null

          Copy-Item "installers/windows/dist/RubberDuck-$version.msi" -Destination $packageRoot -Force
          Copy-Item "installers/windows/INSTALL-WINDOWS.txt" -Destination $packageRoot -Force
          Copy-Item "dist/RubberDuckServer" -Destination (Join-Path $packageRoot "RubberDuckServer") -Recurse -Force

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $zipPath

      - name: Upload combined Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubberduck-windows-package-${{ steps.app_version.outputs.version }}
          path: installers/windows/dist/rubberduck-windows-${{ steps.app_version.outputs.version }}.zip
          if-no-files-found: error
